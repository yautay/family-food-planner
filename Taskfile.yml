# Paśnik — jedyne źródło komend deweloperskich (`task help`).
#
# Kontrakt dla każdej sesji AI: kod uruchamia się TYLKO przez te targety
# (skille pasnik-* i CLAUDE.md odwołują się do ich nazw). Zmiana nazwy komendy
# = aktualizacja Taskfile + CLAUDE.md + skilli pasnik-* w tym samym commicie.
#
# Podział: usługi (baza, hot reload) stoją w Dockerze, narzędzia jakości
# (pytest/ruff/mypy/vitest/eslint) biegną na hoście przez uv i npm — szybka
# pętla zwrotna bez przebudowy obrazu.
#
# Wymagane na hoście: Docker Desktop, uv, Node 22+, go-task.

version: '3'

dotenv: ['.env']

vars:
  COMPOSE: docker compose --env-file .env -f docker/compose.dev.yml
  # Stack TESTOWY obrazu prod (B17): czysta baza + pasnik-app:<tag> + profil backup.
  COMPOSE_TEST: docker compose --env-file .env -f docker/compose.test.yml
  # Wersja obrazu prod = tag gita; bez tagów — sha (09_DEPLOYMENT §1 i §4).
  GIT_VERSION:
    sh: git describe --tags --always --dirty
  # Deploy produkcyjny (B18a, ADR-017): Ansible chodzi w WSL, z venv
  # `~/.venvs/ansible` (ansible-core>=2.16,<2.18 z pipa, NIE z apt). Nazwę
  # dystrybucji można nadpisać: `task deploy WSL_DISTRO=Ubuntu`.
  WSL_DISTRO: Ubuntu-22.04
  # Wejście do Ansible w WSL: deploy/ansible-run.sh (ustawia ANSIBLE_CONFIG, venv, vault).
  ANSIBLE_SH: wsl -d {{.WSL_DISTRO}} --cd "{{.ROOT_DIR}}/deploy" -- bash ansible-run.sh

tasks:
  default:
    cmds:
      - task: help

  help:
    desc: 'Lista dostępnych komend (pełna, z podtaskami: task --list-all)'
    silent: true
    cmds:
      - task --list

  # --- pętla deweloperska ---------------------------------------------------

  dev:
    desc: Podnosi cały stack (app + frontend + db + db-test) z hot reloadem
    cmds:
      - '{{.COMPOSE}} up --build'

  dev-detached:
    desc: Jak `dev`, ale w tle
    cmds:
      - '{{.COMPOSE}} up --build -d'

  dev-db:
    desc: Podnosi wyłącznie bazy (db + db-test) — testy uruchamiane z hosta
    cmds:
      - '{{.COMPOSE}} up -d db db-test'

  down:
    desc: Zatrzymuje stack (dane bazy dev zostają w wolumenie)
    cmds:
      - '{{.COMPOSE}} down'

  logs:
    desc: Logi wszystkich serwisów (Ctrl+C przerywa)
    cmds:
      - '{{.COMPOSE}} logs -f'

  install:
    desc: Instaluje zależności backendu i frontendu
    cmds:
      - task: install-be
      - task: install-fe

  install-be:
    dir: backend
    cmds:
      - uv sync

  install-fe:
    dir: frontend
    cmds:
      - npm ci

  # --- bramka jakości -------------------------------------------------------

  check:
    desc: 'BRAMKA DoD batcha: testy + typy + lint + format + jedna głowa migracji'
    cmds:
      - task: migrations-check
      - task: test-unit
      - task: test-int
      - task: test-api
      - task: fe-test
      - task: typecheck
      - task: lint
      - task: format-check
      - task: fe-build
      - task: fe-types-check

  # Targety pytest przepuszczają argumenty za `--` (CLI_ARGS), żeby dało się
  # zawężyć przebieg bez wołania gołego pytesta (który nie widziałby `.env`):
  #   task test-int -- -k wydajnosc -s
  # Bramka `task check` woła je BEZ argumentów, więc pełny zakres jest zawsze
  # ten sam — argumenty są narzędziem diagnostycznym, nie sposobem na zieleń.
  test-unit:
    desc: 'Testy jednostkowe backendu (bez bazy, sekundy). Zawężenie: -- -k fraza'
    dir: backend
    cmds:
      - uv run pytest -m unit {{.CLI_ARGS}}

  test-int:
    desc: Testy integracyjne backendu (wymagają db-test — `task dev-db`)
    dir: backend
    cmds:
      - uv run pytest -m integration {{.CLI_ARGS}}

  test-api:
    desc: Testy kontraktu HTTP (httpx AsyncClient)
    dir: backend
    cmds:
      - uv run pytest -m api {{.CLI_ARGS}}

  test-be:
    desc: Wszystkie testy backendu naraz
    dir: backend
    cmds:
      - uv run pytest {{.CLI_ARGS}}

  fe-test:
    desc: Testy frontendu (vitest)
    dir: frontend
    cmds:
      - npm run test

  fe-build:
    desc: Produkcyjny build frontendu (bramka — łapie błędy widoczne dopiero w buildzie)
    dir: frontend
    cmds:
      - npx vite build

  test-e2e:
    desc: 'Testy E2E (Playwright, chromium) — wymaga `task e2e-install`. Zawężenie: -- spec.ts'
    dir: frontend
    cmds:
      # Argumenty za `--` trafiają do Playwrighta (wzorzec targetów pytest):
      #   task test-e2e -- offline-lista.spec.ts
      # Bramka wyjścia batcha woła target BEZ argumentów, więc pełny przebieg
      # jest zawsze ten sam — zawężenie jest narzędziem diagnostycznym.
      - npm run e2e -- {{.CLI_ARGS}}

  test-e2e-linux:
    desc: 'Te same E2E w stabilnym Chromium Linux (lokalny stack, obejście błędu Chromium/Windows)'
    vars:
      FRONTEND_CONTAINER:
        sh: '{{.COMPOSE}} ps -q frontend'
    preconditions:
      - sh: 'test -n "{{.FRONTEND_CONTAINER}}"'
        msg: 'Uruchom lokalny stack przez task dev-detached.'
      - sh: >-
          node -e "if (require('./frontend/node_modules/@playwright/test/package.json').version !== '1.62.1') process.exit(1)"
        msg: 'Dopasuj wersję oficjalnego obrazu Playwright do zainstalowanego pakietu.'
    cmds:
      # Ten sam frontend/API i localhost:5173 we współdzielonej przestrzeni
      # sieciowej lokalnego kontenera frontend. Bez nowej bazy i bez publikacji portów.
      # Wersja obrazu musi odpowiadać pakietowi; nie nadpisujemy domyślnych flags.
      - >-
        docker run --rm --init --ipc=host --network=container:{{.FRONTEND_CONTAINER}}
        --env-file .env -e E2E_REUSE_SERVER=1 -e E2E_BASE_URL=http://127.0.0.1:5173
        --mount "type=bind,source={{.ROOT_DIR}},target=/workspace"
        -w /workspace/frontend mcr.microsoft.com/playwright:v1.62.1-noble
        node node_modules/@playwright/test/cli.js test {{.CLI_ARGS}}

  e2e-install:
    desc: Instaluje przeglądarkę dla Playwrighta (jednorazowo)
    dir: frontend
    cmds:
      - npx playwright install chromium

  typecheck:
    desc: Typy — mypy (backend) + vue-tsc (frontend)
    cmds:
      - task: typecheck-be
      - task: typecheck-fe

  typecheck-be:
    dir: backend
    cmds:
      - uv run mypy app tests scripts

  typecheck-fe:
    dir: frontend
    cmds:
      - npm run typecheck

  lint:
    desc: Lint — ruff (backend) + eslint (frontend)
    cmds:
      - task: lint-be
      - task: lint-fe

  lint-be:
    dir: backend
    cmds:
      - uv run ruff check .

  lint-fe:
    dir: frontend
    cmds:
      - npm run lint

  format:
    desc: Formatuje kod (ruff format + prettier) — uruchamiaj przed commitem
    cmds:
      - task: format-be
      - task: format-fe

  format-be:
    dir: backend
    cmds:
      - uv run ruff format .
      - uv run ruff check --fix .

  format-fe:
    dir: frontend
    cmds:
      - npm run format

  format-check:
    desc: Sprawdza formatowanie bez zmian w plikach (część `check`)
    cmds:
      - task: format-check-be
      - task: format-check-fe

  format-check-be:
    dir: backend
    cmds:
      - uv run ruff format --check .

  format-check-fe:
    dir: frontend
    cmds:
      - npm run format:check

  # --- baza danych ----------------------------------------------------------

  db-migrate:
    desc: Aplikuje migracje na bazie dev (alembic upgrade head)
    dir: backend
    cmds:
      - uv run alembic upgrade head

  db-revision:
    desc: 'Nowa migracja. Użycie: task db-revision -- --rev-id 0002 -m "accounts"'
    dir: backend
    cmds:
      - uv run alembic revision {{.CLI_ARGS}}
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: 'Podaj argumenty: task db-revision -- --rev-id 0002 -m "accounts"'

  db-heads:
    desc: Pokazuje głowy migracji (musi być dokładnie jedna)
    dir: backend
    cmds:
      - uv run alembic heads

  migrations-check:
    desc: Weryfikuje, że łańcuch migracji ma dokładnie jedną głowę
    dir: backend
    cmds:
      - uv run pytest tests/unit/test_migrations_chain.py -q

  db-shell:
    desc: psql na bazie dev
    cmds:
      - '{{.COMPOSE}} exec db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

  create-admin:
    desc: 'Tworzy konto administratora (hasło z promptu albo PASNIK_ADMIN_PASSWORD)'
    dir: backend
    interactive: true
    cmds:
      - uv run python -m app.cli create-admin

  db-seed-demo:
    desc: 'Deterministyczny seed demo (idempotentny). Zakres rośnie z batchami domenowymi'
    dir: backend
    cmds:
      - uv run python -m scripts.seed_demo

  ux-baseline:
    desc: 'Bezpieczny zestaw lokalnych danych UX00 (wyłącznie odrębne bazy pasnik_ux / pasnik_ux_test)'
    dir: backend
    cmds:
      - uv run python -m scripts.ux_baseline {{.CLI_ARGS}}

  uploads-report:
    desc: 'Raport plików uploadów BEZ referencji w bazie (B17, D10) — tylko raportuje, nic nie usuwa'
    dir: backend
    cmds:
      - uv run python -m app.cli uploads-report

  # --- narzędzie /pdf-extract (BATCH_22, D31): jadłospis PDF -> paczka transferu ----
  # Poza runtime aplikacji. Ścieżki względne liczone są od KORZENIA REPO. Nic nie
  # wgrywa na produkcję; `pdfx-roundtrip` dotyka wyłącznie bazy TESTOWEJ.

  pdfx-index:
    desc: 'Katalog znanych produktów albo zestawienie spec z katalogiem (BRAMKA 1). -- [spec.json] [--instance-export export.json]'
    dir: backend
    cmds:
      - uv run python -m scripts.pdf_extract index {{.CLI_ARGS}}

  pdfx-verify:
    desc: 'Weryfikacja wersji silnikiem aplikacji; z --report zapisuje report.md (BRAMKA 2). -- data/diet-imports/NNNN-slug/spec.json [--report]'
    dir: backend
    cmds:
      - uv run python -m scripts.pdf_extract verify {{.CLI_ARGS}}

  pdfx-package:
    desc: 'Buduje export.zip (paczka transferu v1) po udanej weryfikacji. -- <spec> [--recipe-scope household|private|global --owner-email <e-mail ADMIN-a>]'
    dir: backend
    cmds:
      - uv run python -m scripts.pdf_extract package {{.CLI_ARGS}}

  pdfx-roundtrip:
    desc: 'Import paczki na bazie TESTOWEJ dwa razy (created=0 przy drugim). Wymaga `task dev-db`; nie równolegle z test-int. -- <export.zip>'
    dir: backend
    cmds:
      - uv run python -m scripts.pdf_extract roundtrip {{.CLI_ARGS}}

  # --- obraz prod, stack testowy, backup (BATCH_17; compose.prod spina B18) ----

  build-prod:
    desc: 'Buduje obrazy prod: pasnik-app:<git describe> (SPA w środku, ADR-014) i pasnik-backup'
    cmds:
      - docker build -f docker/Dockerfile --target prod --build-arg APP_VERSION={{.GIT_VERSION}} -t pasnik-app:{{.GIT_VERSION}} -t pasnik-app:latest .
      - docker build -f docker/backup/Dockerfile -t pasnik-backup:{{.GIT_VERSION}} -t pasnik-backup:latest .

  test-stack-up:
    desc: 'Podnosi stack testowy obrazu prod (compose.test: db + app na 127.0.0.1:8081) i migruje'
    cmds:
      - '{{.COMPOSE_TEST}} up -d db'
      - '{{.COMPOSE_TEST}} run --rm app alembic upgrade head'
      - '{{.COMPOSE_TEST}} up -d app'

  test-stack-down:
    desc: 'Zatrzymuje stack testowy i KASUJE jego wolumeny (baza, uploady)'
    cmds:
      - '{{.COMPOSE_TEST}} --profile backup down -v --remove-orphans'

  backup:
    desc: 'Backup stacku testowego: pg_dump -Fc + uploady + prune 7d/4w (docker/backup/backup.sh)'
    cmds:
      - '{{.COMPOSE_TEST}} --profile backup run --rm backup backup'

  restore:
    desc: 'Restore do stacku testowego. Użycie: task restore -- pasnik-<stempel>.dump [pasnik-<stempel>-uploads.tar.gz] [--wipe-uploads] (nazwy z katalogu backupów)'
    cmds:
      - '{{.COMPOSE_TEST}} stop app'
      - '{{.COMPOSE_TEST}} --profile backup run --rm backup restore {{.CLI_ARGS}}'
      - '{{.COMPOSE_TEST}} run --rm app alembic upgrade head'
      - '{{.COMPOSE_TEST}} start app'
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: 'Podaj plik dumpu: task restore -- pasnik-<stempel>.dump [pasnik-<stempel>-uploads.tar.gz]'

  backup-drill:
    desc: 'Round-trip backup → down -v → restore → smoke na stacku testowym (docker/backup/drill.sh)'
    cmds:
      - bash docker/backup/drill.sh

  # --- kontrakt API ---------------------------------------------------------

  fe-types:
    desc: Generuje typy TS z OpenAPI (backend/openapi.json → src/api/generated.ts)
    cmds:
      - task: fe-types-export
      - task: fe-types-generate

  fe-types-export:
    dir: backend
    cmds:
      - uv run python -m scripts.export_openapi openapi.json

  fe-types-generate:
    dir: frontend
    cmds:
      - npm run generate:api

  fe-types-check:
    desc: 'Bramka świeżości kontraktu (dług U12, B17): openapi.json i generated.ts muszą odpowiadać kodowi'
    dir: backend
    cmds:
      # Porównanie „wygenerowane teraz" vs „w repo" — NIE `git diff`: `task check`
      # jest bramką PRZED commitem, więc drzewo jest brudne z definicji.
      - uv run python -m scripts.check_api_contract

  # --- bezpieczeństwo (Review batche i BATCH_17) ----------------------------

  audit:
    desc: Audyt zależności (pip-audit + npm audit) — Review batche i B17
    cmds:
      - task: audit-be
      - task: audit-fe

  audit-be:
    dir: backend
    cmds:
      - uv run --with pip-audit pip-audit --strict

  audit-fe:
    dir: frontend
    cmds:
      - npm audit --audit-level=high

  secrets-scan:
    desc: Skan sekretów w repo (gitleaks przez docker run)
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --verbose

  # --- deploy produkcyjny (BATCH_18a; LXC + ansistrano, ADR-017) ---------------
  # Wymagania operatora (poza Docker Desktop, uv, Node, go-task): WSL z Ubuntu,
  # `python3 -m venv ~/.venvs/ansible` + `pip install "ansible-core>=2.16,<2.18"`,
  # `task deploy-galaxy` (role ansistrano), vault z sekretami POZA repo
  # (`~/pasnik-prod.yml`, `ansible-vault create`). Opis: deploy/README.md.

  deploy-galaxy:
    desc: 'Instaluje role i kolekcje Ansible (ansistrano 4.4.0/4.0.1) do deploy/.ansible'
    cmds:
      - '{{.ANSIBLE_SH}} galaxy'

  deploy-syntax:
    desc: 'ansible-playbook --syntax-check dla wszystkich playbooków deploy/'
    cmds:
      - '{{.ANSIBLE_SH}} syntax'

  provision:
    desc: 'Provision maszyny (kanał root, raz): unity, pasnik.env, pgpass, pasnik-cli. Vault: ~/pasnik-prod.yml (PASNIK_VAULT_FILE)'
    interactive: true
    cmds:
      - '{{.ANSIBLE_SH}} provision {{.CLI_ARGS}}'

  deploy:
    desc: 'Wdrożenie na produkcję: fe-build → secrets-scan → ansistrano (dump → migracja → symlink → health). Próba: -- --check --diff'
    cmds:
      - task: fe-build
      - task: secrets-scan
      - '{{.ANSIBLE_SH}} deploy -e release_version={{.GIT_VERSION}} {{.CLI_ARGS}}'

  rollback:
    desc: 'Powrót do poprzedniego release (migracji NIE cofa — runbook w deploy/README.md). Konkretny: -- -e ansistrano_rollback_to_release=<ts>'
    cmds:
      - '{{.ANSIBLE_SH}} rollback {{.CLI_ARGS}}'

  deploy-caddy-vhost:
    desc: 'Renderuje przykładowy blok Caddy do deploy/.ansible/pasnik-caddy-vhost.conf (wkleja właściciel, D7)'
    cmds:
      - '{{.ANSIBLE_SH}} caddy-vhost'
