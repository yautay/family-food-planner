---
# Inwentarz produkcji: kontener Incus `pasnik` na hoście 192.168.2.121
# (B18a, ADR-017, D30 — host zmieniony z .111). Host obsługuje właściciel; agent
# i Ansible mają WYŁĄCZNIE kontener po SSH. Jedyne środowisko — pre-prod/staging jest poza zakresem B18.
all:
  children:
    prod:
      hosts:
        pasnik:
          # Proxy device Incusa na hoście: 0.0.0.0:2223 -> 127.0.0.1:22 kontenera
          # (2223 do potwierdzenia `ss -ltnp` na hoście przed `create-incus.sh`).
          ansible_host: 192.168.2.121
          ansible_port: 2223
