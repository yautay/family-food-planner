# Konfiguracja Ansible dla deployu Paśnika (B18a) — układ 1:1 jak w runnerze
# (nc-tech-test-runner/deploy): jedna osoba, jedno narzędzie, jedne ustawienia.
#
# UWAGA: Ansible czyta ten plik z BIEŻĄCEGO katalogu, nie z katalogu playbooka,
# a checkout na /mnt/c (WSL) jest „world-writable" — wtedy Ansible IGNORUJE ten
# plik (i `roles_path` razem z nim). Dlatego wrappery Taskfile (`task deploy`)
# ustawiają jawnie `ANSIBLE_CONFIG=ansible.cfg` i podają `-i inventories/prod`;
# ręczne komendy z deploy/README.md robią to samo.

[defaults]
inventory = inventories/prod

# Role i kolekcje z `requirements.yml` leżą obok playbooków, poza gitem.
roles_path = .ansible/roles
collections_path = .ansible/collections

# Maszyna ma systemowy Python 3.13 — `auto_silent` bierze go bez ostrzeżenia.
interpreter_python = auto_silent

# Klucz hosta kontenera zmienia się po każdym `create-incus.sh --recreate`.
# Sprawdzania NIE wyłączamy — stary klucz kasuje jawne zadanie
# `tasks/refresh-host-key.yml`.
host_key_checking = True

retry_files_enabled = False
# `yaml` jako osobny callback zniknął z ansible-core (jest w community.general,
# której nie instalujemy) — czytelne wyjście daje wbudowany `default` w trybie yaml.
stdout_callback = ansible.builtin.default
callback_result_format = yaml
display_skipped_hosts = False

[ssh_connection]
# Pipelining skraca deploy i nie zostawia plików tymczasowych na hoście.
# Wymaga sudoers bez `requiretty` — obraz z `deploy/lxc/` go nie ustawia.
pipelining = True
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s
