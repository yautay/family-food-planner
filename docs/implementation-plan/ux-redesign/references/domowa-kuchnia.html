  function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}

  });
  root.addEventListener('input',function(e){
    if(e.target.hasAttribute('data-query')){state.query=e.target.value;before.querySelector('[data-recipe-grid]').innerHTML=recipeGrid(true);after.querySelector('[data-recipe-grid]').innerHTML=recipeGrid(false);const inputs=root.querySelectorAll('[data-query]');inputs.forEach(function(el){if(el!==e.target)el.value=state.query});if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:17,height:17}})}
    if(e.target.hasAttribute('data-picker-search')){const q=e.target.value.toLowerCase();after.querySelectorAll('[data-picker-name]').forEach(function(el){el.hidden=!el.dataset.pickerName.includes(q)})}
    if(e.target.hasAttribute('data-person-portion')){const total=Array.from(after.querySelectorAll('[data-person-portion]')).reduce(function(sum,el){return sum+Math.max(0,Number(el.value)||0)},0);after.querySelector('[data-portion-total]').textContent=total.toLocaleString('pl-PL')}
  });
  root.addEventListener('keydown',function(e){if(e.key==='Escape'&&state.modal){state.modal=null;render()}});
  window.addEventListener('openai:set_globals',function(e){const w=e.detail&&e.detail.globals&&e.detail.globals.widgetState;const p=w&&w.privateContent;if(p&&screens.includes(p.screen)){state.screen=p.screen;state.device=p.device==='mobile'?'mobile':'desktop';render()}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:after,onChange:render});tweak.addToggle(state,'ornaments',{label:'Dekoracje — domowa kuchnia'});tweak.addSelect(state,'dayState',{label:'Plan dnia — stan',options:[{label:'Z posiłkami',value:'ready'},{label:'Pierwsze użycie',value:'empty'},{label:'Błąd pobierania',value:'error'}]});tweak.addToggle(state,'nutritionOpen',{label:'Pokaż szczegóły bilansu'});}
})();
</script>
